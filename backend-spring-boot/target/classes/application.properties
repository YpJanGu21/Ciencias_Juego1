# Spring Boot Configuration
spring.application.name=super-eco-bros-backend
server.port=8080

# Base de Datos H2 / PostgreSQL
spring.datasource.url=jdbc:h2:mem:ecodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola H2 para depuración
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# CORS para React/Vite en desarrollo, puerto por defecto y vista previa
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4173
